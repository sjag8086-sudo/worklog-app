<!DOCTYPE html>
<html>

<head>
    <title>Printer Work Log　登録</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <!-- ✅ Excelボタン -->
    <a href="/excel" class="btn btn-success mb-3">Work Log</a>

    <h1 class="mb-4">Printer Work Log　登録</h1>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <!-- 登録 -->
    <form method="POST" class="mb-4">
        <div class="input-group">
            <input type="text" name="username" class="form-control" placeholder="">
            <button type="submit" class="btn btn-primary">追加</button>
        </div>
    </form>

    <!-- 検索 -->
    <form method="GET" class="mb-4">
        <div class="input-group">
            <input type="text" name="search" class="form-control" placeholder="">
            <button type="submit" class="btn btn-secondary">検索</button>
        </div>
    </form>

    <h2>一覧</h2>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>名前</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>
                    <a href="/edit/{{ user.id }}" class="btn btn-warning btn-sm">編集</a>

                    <a href="/delete/{{ user.id }}"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('ID={{ user.id }} を削除します。本当にいいですか？')">
                        削除
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
