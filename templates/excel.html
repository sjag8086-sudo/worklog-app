<!DOCTYPE html>
<html>

<head>
    <title>Printer Work Log</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            padding: 15px;
        }

        h1 {
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            table {
                font-size: 14px;
            }
        }
    </style>
</head>

<body class="container">

<h1>Printer Work Log</h1>

<!-- ✅ 検索 -->
<form method="GET" class="mb-4">

    <label class="form-label">SN検索</label>

    <div class="input-group input-group-lg">
        <input type="text" name="search" class="form-control" placeholder="SNを入力">
        <button class="btn btn-primary">検索</button>
    </div>

</form>

<!-- ✅ テーブル -->
<div class="table-responsive">

<table class="table table-bordered table-striped">

<tr>
    <th>SN</th>
    <th>作業日</th>
    <th>作業者</th>
    <th>依頼内容</th>
    <th>作業内容</th>
</tr>

{% for row in data %}
<tr>
    <td>{{ row["SN"] }}</td>

    <td>
        <a href="/detail/{{ row['index'] }}">
            {{ row["作業日"] }}
        </a>
    </td>

    <td>{{ row["作業者"] }}</td>
    <td>{{ row["依頼内容"] }}</td>
    <td>{{ row["作業内容"] }}</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
